plugins {
	// 26.1+: the game is not scrambled any more, so this is the new Loom plugin (no "mappings", no remapping)
	id 'net.fabricmc.fabric-loom' version '1.18.2'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = 'Keksuccino'
		url = 'https://keksuccino.github.io/maven/'
	}
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup 'maven.modrinth'
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// the browser library Rinku (the real mod must also be in your mods folder).
	// Rinku 3.0.5 for 26.3 is NOT on Keksuccino's maven, so the jar is taken from the folder  libs/  (see libs/README.txt).
	// If libs/ has no jar, the maven is tried (works when the version is published there).
	def rinkuJar = fileTree(dir: 'libs', include: '*.jar')
	if (!rinkuJar.isEmpty()) {
		compileOnly rinkuJar
		runtimeOnly rinkuJar
	} else {
		compileOnly "de.keksuccino:rinku-fabric:${project.rinku_version}"
		runtimeOnly "de.keksuccino:rinku-fabric:${project.rinku_version}"
	}

	// Mod Menu: only needed to compile the settings button (the real Mod Menu mod goes into your mods folder)
	compileOnly "maven.modrinth:modmenu:${project.modmenu_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.release = 25
}

java {
	withSourcesJar()
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}
