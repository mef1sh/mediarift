<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Live</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:Arial,sans-serif}
video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
#msg{position:fixed;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;color:#e6e6e6;font-size:15px;line-height:1.35;padding:0 18px;pointer-events:none;text-shadow:0 0 6px #000;white-space:pre-line}
#warn{position:fixed;bottom:8px;left:8px;right:8px;background:rgba(170,95,0,.88);color:#fff;font-size:12px;padding:4px 8px;border-radius:4px;display:none}
#click{position:fixed;left:0;top:0;right:0;bottom:0;display:none;cursor:pointer;background:rgba(0,0,0,.4);color:#fff;font-size:26px;align-items:center;justify-content:center;text-align:center}
</style>
</head>
<body>
<video id="v" autoplay playsinline></video>
<div id="msg">Starting the stream...</div>
<div id="warn"></div>
<div id="click"></div>
<script>
(function () {
  var v = document.getElementById('v'), msg = document.getElementById('msg'),
      warn = document.getElementById('warn'), click = document.getElementById('click');
  var title = new URLSearchParams(location.search).get('t') || 'Live stream';
  document.title = title;
  try { navigator.mediaSession.metadata = new MediaMetadata({ title: title, artist: 'LIVE' }); } catch (e) {}

  var tries = 0, pausedAt = 0, needReload = false;
  // true = a normal video with an end (not a live stream): it is never pushed to the live edge and never restarted after a pause
  var isVod = false;

  function setState(s) { try { navigator.mediaSession.playbackState = s; } catch (e) {} }
  function say(t) { if (t) { msg.textContent = t; msg.style.display = 'block'; } else { msg.style.display = 'none'; } }
  function askClick(text, reload) { needReload = reload; click.textContent = text; click.style.display = 'flex'; }

  function load() {
    click.style.display = 'none';
    say(tries ? 'Reconnecting...' : 'Starting the stream...\n(the first picture can take a few seconds)');
    v.src = 'live.webm?' + Date.now();
    var p = v.play();
    if (p && p.catch) p.catch(function () { askClick('\u25B6  Click to play', false); });
  }

  function fail() {
    setState('paused');
    fetch('status?' + Date.now()).then(function (r) { return r.json(); }).then(function (s) {
      if (s.state === 'error') {
        say(s.message || 'The stream could not be started.');
        askClick('Click to try again', true);
      } else if (!isVod && tries < 3) {
        tries++;
        setTimeout(load, 1500);
      } else {
        say(s.message || 'The stream stopped.');
        askClick('Click to try again', true);
      }
    }).catch(function () {
      say('The stream stopped.');
      askClick('Click to try again', true);
    });
  }

  v.addEventListener('playing', function () {
    tries = 0; pausedAt = 0; say(''); click.style.display = 'none'; setState('playing');
    // ask once what kind of picture this is: a live stream or a video with an end
    fetch('status?' + Date.now()).then(function (r) { return r.json(); }).then(function (s) {
      isVod = !!s.vod;
    }).catch(function () {});
  });
  v.addEventListener('waiting', function () { say('Buffering...'); });
  v.addEventListener('pause', function () { if (!pausedAt) pausedAt = Date.now(); setState('paused'); });
  v.addEventListener('play', function () {
    // after a long pause the old picture is far behind: reconnect, so it jumps back to the live edge
    if (!isVod && pausedAt && Date.now() - pausedAt > 4000) { pausedAt = 0; load(); } else { pausedAt = 0; }
  });
  v.addEventListener('error', fail);
  v.addEventListener('ended', fail);

  click.addEventListener('click', function () {
    click.style.display = 'none';
    if (needReload) { needReload = false; tries = 0; load(); }
    else { var p = v.play(); if (p && p.catch) p.catch(function () {}); }
  });

  // keep the delay small: if the picture is more than 3 s behind what we already have, jump forward
  setInterval(function () {
    try {
      if (isVod || v.paused || !v.buffered.length) return;
      var end = v.buffered.end(v.buffered.length - 1);
      if (end - v.currentTime > 3) v.currentTime = end - 0.6;
    } catch (e) {}
  }, 1500);

  // warn when the computer cannot convert the stream fast enough
  setInterval(function () {
    fetch('status?' + Date.now()).then(function (r) { return r.json(); }).then(function (s) {
      if (s.state === 'live' && s.speed > 0 && s.speed < 0.92) {
        warn.textContent = 'Your computer is too slow for this quality (' + s.speed.toFixed(2) +
          'x). Choose a lower Resolution (or the VP8 codec) in the MediaRift settings.';
        warn.style.display = 'block';
      } else {
        warn.style.display = 'none';
      }
    }).catch(function () {});
  }, 5000);

  load();
})();
</script>
</body>
</html>
